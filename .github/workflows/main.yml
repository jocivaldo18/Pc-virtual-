name: Windows Cloud PC - Moonlight/Sunshine (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Configurando Host para Moonlight...
    runs-on: windows-latest
    timeout-minutes: 10080 

    steps:
      - name: Baixando e Instalando Sunshine
        run: |
          # Baixa o instalador do Sunshine (exemplo de link direto via GitHub Release)
          $url = "https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-windows-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile "sunshine_installer.exe"
          
          # Instalação silenciosa
          Start-Process -FilePath ".\sunshine_installer.exe" -ArgumentList "/S" -Wait
          
      - name: Configurando Drivers de Vídeo Virtual
        run: |
          # O Moonlight precisa de uma tela. Como o GitHub Actions é "headless", 
          # você precisará de um driver como o IddSampleDriver para simular um monitor.
          Write-Host "Instalando driver de monitor virtual..."
          # Aqui entraria o comando para baixar/instalar o monitor virtual necessário.

      - name: Iniciar Sunshine Service
        run: |
          # Tenta iniciar o Sunshine como serviço ou processo de fundo
          Start-Process "C:\Program Files\Sunshine\sunshine.exe"

      - name: Manter Conexão Ativa
        run: |
          Write-Host "Aguardando conexão via Moonlight..."
          # Mantém o workflow rodando para a máquina não desligar
          Start-Sleep -Seconds 604800

      - name: Limpeza
        if: always()
        run: |
          Remove-Item sunshine_installer.exe -Force
          Write-Host "Processo finalizado."
